header{padding-bottom:10px;border-bottom:3px solid var(--or,#ff9a3c)}h1{color:var(--acc)}.row{border-left:6px solid var(--gc,var(--or,#ff9a3c));box-shadow:0 1px 3px rgba(0,0,0,.06)}.primary{background:linear-gradient(135deg,var(--acc),#1b8fb5)}.chip[aria-pressed=true]{background:var(--or,#ff9a3c);border-color:var(--or,#ff9a3c);color:#1c1200}.cours summary{color:var(--acc)}.corr{border-top:4px solid var(--acc)}.txt{border-left-color:var(--or,#ff9a3c)}
.qz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}.qq{font-weight:600;margin:0 0 8px}.qo{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;color:var(--ink)}.qo.ok{background:#d6f5e6;border-color:#14a86c;color:#0b3d2a}.qo.ko{background:#fde0e6;border-color:#ee5a7e;color:#5a1020}.ex{color:var(--mute);margin:6px 0 0;font-size:.95rem}.score{font-weight:700;color:var(--acc)}

.primary{background:#0b6b4a}

.grp{background:none;border:0;border-radius:0;padding:0 2px;margin:20px 0 8px;color:var(--c,#0b6b4a);font-size:1.02rem;letter-spacing:.2px}

<body>
<main id="app"></main>
<script>
var G=["Méthodologie","Les conditions de la liberté","Les conditions du progrès","Les conditions d'élaboration de la vérité"];
function S(k,q,c,t){return{k:k,q:q,c:c,txt:t,src:t?"Texte d'entraînement (rédigé pour l'app)":k==="méthode"?"Programme officiel":"Sujet type"}}
var L=[
{id:"dissertation",t:"La dissertation philosophique",g:0,m:1,s:[S("méthode","Fiche : construire une dissertation philosophique",["Introduction : contextualiser le sujet, analyser les termes, poser le problème, annoncer les axes d'analyse.","Développement : des axes d'analyse cohérents avec le problème, chacun appuyé par des arguments et des références, avec un enchaînement logique et progressif.","Conclusion : faire le bilan de l'analyse, répondre clairement au problème posé, ouvrir éventuellement le débat.","Barème officiel (BAC 2021) : introduction 5 points, développement 12 points, conclusion 3 points."])]},
{id:"commentaire",t:"Le commentaire de texte philosophique",g:0,m:1,s:[S("méthode","Fiche : rédiger un commentaire de texte philosophique",["Introduction : thème, problème, thèse de l'auteur et, éventuellement, structure logique.","Étude ordonnée : expliquer chaque mouvement du texte (idée principale, arguments, concepts, exemples, figures de style) et relier les mouvements par des transitions.","Intérêt philosophique : critique interne (cohérence et validité de la démarche, forces et faiblesses des arguments), puis critique externe (justifier la thèse à la lumière d'autres positions, ou en montrer les limites).","Conclusion : bilan et point de vue personnel.","Barème officiel (BAC 2021) : introduction 4 points, étude ordonnée 6 points, intérêt philosophique 8 points (critique interne 2, critique externe 5, cohérence et style 1), conclusion 2 points."])]},
{id:"homme",t:"La connaissance de l'homme",g:1,s:[
S("dissertation","La conscience suffit-elle pour connaître l'homme ?",["Problème : la conscience peut-elle rendre compte de tout ce que nous sommes ?","I. La conscience et la liberté caractérisent l'homme : il pense, choisit, se juge.","II. L'inconscient et la violence révèlent d'autres dimensions que la conscience ne maîtrise pas.","III. L'homme est un être complexe : on le connaît en croisant conscience, inconscient et conduites.","Conclusion : la conscience est nécessaire, non suffisante."]),
S("dissertation","Le déterminisme psychologique supprime-t-il la responsabilité de l'homme ?",["Problème : si nos actes ont des causes psychiques, peut-on encore nous les imputer ?","I. Si tout est déterminé, la responsabilité semble sans objet.","II. Mais l'homme conscient peut examiner ses motifs et en répondre.","III. Responsabilité et déterminisme se concilient : comprendre les causes n'excuse pas toujours.","Conclusion : le déterminisme limite la responsabilité, il ne l'abolit pas."])]},
{id:"societe",t:"La vie en société",g:1,s:[
S("dissertation","L'homme peut-il vivre sans la société ?",["Problème : la société est-elle une nécessité de la nature humaine ou un choix ?","I. L'homme est un être social : besoins, langage, éducation passent par les autres.","II. La société est aussi source de contraintes et de violence.","III. L'État et la Nation donnent un cadre à la vie commune pour concilier ces exigences.","Conclusion : l'homme ne devient pleinement homme que parmi les hommes."]),
S("dissertation","Autrui est-il un obstacle ou une condition de ma liberté ?",["Problème : ma liberté se heurte-t-elle à celle des autres ou se construit-elle avec elle ?","I. Autrui me limite : conflits, domination, violence.","II. Autrui me révèle à moi-même et m'offre la reconnaissance.","III. La liberté en société suppose des règles qui respectent celle de chacun.","Conclusion : autrui est à la fois limite et condition de ma liberté."])]},
{id:"religion",t:"Dieu et la religion",g:1,s:[
S("dissertation","La religion est-elle un obstacle à la liberté ?",["Problème : croire et pratiquer une religion enchaînent-ils ou libèrent-ils ?","I. La religion impose dogmes et obligations, parfois jusqu'au fanatisme.","II. Elle donne un sens, des repères moraux et un rôle social positif.","III. La pratique religieuse est libératrice quand elle est choisie et tolérante.","Conclusion : tout dépend de la manière de vivre la foi."]),
S("dissertation","L'homme est-il un être naturellement religieux ?",["Problème : l'idée de Dieu est-elle inscrite dans la nature humaine ?","I. Partout, les hommes cherchent un sens à la vie et à la mort.","II. On peut aussi voir la religion comme un produit de la société ou de l'éducation.","III. Le besoin de sens est naturel, ses formes sont culturelles.","Conclusion : la religion exprime une quête de sens propre à l'homme."])]},
{id:"valeur",t:"La valeur de la philosophie",g:2,s:[
S("dissertation","La philosophie joue-t-elle un rôle dans l'histoire des hommes ?",["Problème : la pensée philosophique agit-elle réellement sur le cours de l'histoire ?","I. Elle semble inutile : elle ne produit ni richesse ni objets.","II. Elle a pourtant inspiré des idées de liberté, de droits et de justice qui ont transformé les sociétés.","III. Elle forme l'esprit critique, condition d'un homme acteur de son histoire.","Conclusion : la philosophie agit indirectement mais profondément."]),
S("dissertation","À quoi sert la philosophie ?",["Problème : une discipline sans application immédiate a-t-elle une utilité ?","I. Elle ne sert à rien de matériel : son utilité n'est pas technique.","II. Elle clarifie les notions, développe l'esprit critique et éclaire les choix.","III. Sa valeur est de former des hommes libres et responsables.","Conclusion : son inutilité apparente fait sa valeur."])]},
{id:"progres",t:"Progrès et bonheur",g:2,s:[
S("dissertation","Le progrès conduit-il nécessairement au bonheur ?",["Problème : l'amélioration des conditions de vie rend-elle l'homme heureux ?","I. Le progrès matériel soulage la peine : santé, confort, communication.","II. Il crée aussi de nouveaux maux : inégalités, pollution, guerres.","III. Le bonheur exige aussi un progrès spirituel et moral : le développement véritable est équilibré.","Conclusion : le progrès est condition du bonheur, non sa garantie."]),
S("dissertation","La technique libère-t-elle l'homme ?",["Problème : les moyens techniques et le travail nous affranchissent-ils ou nous asservissent-ils ?","I. La technique allège le travail et élargit les possibilités de l'homme.","II. Elle crée des dépendances et peut déshumaniser le travail.","III. Bien maîtrisée, elle est un instrument de liberté.","Conclusion : la technique libère si l'homme garde la maîtrise de ses fins."])]},
{id:"langage",t:"Langage et vérité",g:3,s:[
S("dissertation","Les mots peuvent-ils dire toute la vérité ?",["Problème : le langage est-il un outil fiable pour exprimer le vrai ?","I. Le langage permet de communiquer, de nommer et de transmettre la vérité.","II. Il a des limites : ambiguïté, mensonge, ce qui ne se dit pas.","III. Le pouvoir du langage dépend de la rigueur de celui qui l'emploie.","Conclusion : le langage est le chemin de la vérité mais ne la contient pas toute."]),
S("texte","Dégagez l'intérêt philosophique de ce texte.",["Thème : le rapport entre langage et vérité.","Problème : peut-on dire vrai avec des mots qui ne collent jamais tout à fait à l'expérience ?","Thèse : le langage ordonne le réel mais demande d'être choisi et mis à l'épreuve pour dire vrai.","Étude ordonnée : (1) parler, c'est ordonner et juger ; (2) la distance entre les mots et le vécu ; (3) l'exigence de rigueur.","Intérêt : valeur du texte, mais aussi limite du langage face à l'indicible."],"Celui qui parle ne se contente pas de nommer les choses : il les ordonne, les compare, les juge. Mais les mots, hérités et partagés, ne collent jamais tout à fait à ce que chacun éprouve ; dire vrai demande donc de les choisir avec soin et de les mettre à l'épreuve.")]},
{id:"science",t:"La connaissance scientifique",g:3,s:[
S("dissertation","La science peut-elle tout expliquer ?",["Problème : la connaissance scientifique a-t-elle des limites ?","I. Par la raison et l'expérience, la science explique de plus en plus de phénomènes.","II. Elle trouve ses limites dans l'étude du vivant, des sciences humaines et face aux questions de sens.","III. La science est une démarche qui se corrige : sa force est de connaître ses limites.","Conclusion : la science est puissante sans être exhaustive."]),
S("dissertation","Peut-on appliquer la démarche expérimentale à l'étude de l'homme ?",["Problème : les méthodes des sciences de la nature conviennent-elles aux sciences humaines ?","I. La démarche expérimentale donne rigueur et objectivité.","II. L'homme est conscient, libre et singulier : difficile à isoler et à reproduire en laboratoire.","III. Les sciences humaines adaptent leurs méthodes à leur objet.","Conclusion : l'expérimentation est utile mais insuffisante pour l'homme."])]}
];
var X={
homme:[S("dissertation","L'homme est-il seulement ce qu'il a conscience d'être ?",["Problème : se réduit-on à ce que l'on sait de soi ?","I. La conscience fait de nous des êtres qui se pensent et se choisissent.","II. L'inconscient et les conditions de vie agissent à notre insu.","III. L'homme est un être complexe, à la fois conscient et déterminé.","Conclusion : nous sommes plus que ce que nous savons de nous."]),
S("dissertation","La violence est-elle un trait de la nature humaine ?",["Problème : l'homme est-il violent par nature ou par éducation ?","I. Les conflits, les pulsions et l'histoire suggèrent une violence naturelle.","II. La violence varie selon les sociétés et les conditions : elle est aussi apprise.","III. La conscience et la raison permettent de la maîtriser.","Conclusion : la violence est une possibilité de l'homme, non une fatalité."])],
societe:[S("dissertation","La violence est-elle inévitable dans la société ?",["Problème : la vie commune peut-elle exister sans conflit ni contrainte ?","I. Rivalités, inégalités et intérêts opposés rendent la violence omniprésente.","II. Lois, institutions et éducation visent à la limiter.","III. La société peut réduire la violence sans jamais la supprimer tout à fait.","Conclusion : on la contient par le droit et le dialogue."]),
S("dissertation","L'État peut-il à lui seul faire la Nation ?",["Problème : distinguer l'État, organisation politique, de la Nation, communauté de destin.","I. L'État unifie par les lois, l'école, les institutions.","II. La Nation repose aussi sur une histoire, des valeurs et un sentiment d'appartenance partagés.","III. Une Nation solide naît de l'adhésion des citoyens, que l'État doit favoriser.","Conclusion : l'État peut aider à faire la Nation, il ne peut s'y substituer."])],
religion:[S("dissertation","La religion est-elle nécessaire à la morale ?",["Problème : l'obligation morale a-t-elle besoin de Dieu pour s'imposer ?","I. La religion donne des interdits, des sanctions et un fondement sacré aux devoirs.","II. Des hommes non croyants agissent moralement : la raison suffit à fonder le devoir.","III. Religion et morale peuvent se renforcer sans se confondre.","Conclusion : la morale n'a pas besoin de la religion, mais peut s'en nourrir."]),
S("dissertation","L'idée de Dieu est-elle une illusion ?",["Problème : l'idée de Dieu correspond-elle à une réalité ou à un besoin humain ?","I. Elle peut apparaître comme une consolation face à la peur et à la mort.","II. Elle exprime aussi une quête de sens que la raison ne comble pas toujours.","III. La question reste ouverte : la raison ne peut ni la prouver ni la réfuter définitivement.","Conclusion : l'idée de Dieu dit quelque chose de l'homme, quelle que soit sa vérité."])],
valeur:[S("dissertation","L'homme fait-il l'histoire ou la subit-il ?",["Problème : l'homme est-il acteur ou jouet des événements ?","I. Les conditions économiques, sociales et naturelles pèsent sur lui.","II. Par ses décisions, ses luttes et ses idées, il transforme le cours des choses.","III. L'homme fait l'histoire dans des conditions qu'il n'a pas choisies.","Conclusion : il est à la fois acteur et héritier."]),
S("dissertation","Philosopher, est-ce perdre son temps ?",["Problème : la réflexion sans résultat immédiat a-t-elle une valeur ?","I. Philosopher ne produit rien de mesurable ni d'utile directement.","II. Elle apprend à douter, à argumenter et à juger.","III. Cette formation est la condition d'une vie libre et d'un citoyen responsable.","Conclusion : philosopher est un temps gagné pour l'esprit."])],
progres:[S("dissertation","Le travail est-il une malédiction ou une chance pour l'homme ?",["Problème : le travail est-il un fardeau ou une source d'épanouissement ?","I. Il fatigue, contraint et peut aliéner.","II. Il transforme la nature, forme l'homme et donne sa place dans la société.","III. Tout dépend des conditions : un travail digne et choisi est une chance.","Conclusion : le travail est une nécessité qu'il faut humaniser."]),
S("dissertation","Peut-on parler de progrès sans progrès moral ?",["Problème : l'amélioration des techniques suffit-elle à faire progresser l'humanité ?","I. Le progrès matériel est visible : santé, savoirs, moyens de vivre.","II. Sans progrès moral, ces moyens peuvent servir la guerre et l'injustice.","III. Un vrai progrès associe progrès matériel et progrès spirituel.","Conclusion : le progrès véritable est global."])],
langage:[S("dissertation","Communiquer, est-ce nécessairement parler ?",["Problème : le langage articulé est-il la seule forme de communication ?","I. La parole est le moyen le plus précis de communiquer des idées.","II. Gestes, regards, images, signes et silences communiquent aussi.","III. Les formes de communication se complètent selon ce que l'on veut exprimer.","Conclusion : parler est une manière de communiquer parmi d'autres."]),
S("dissertation","Existe-t-il plusieurs sortes de vérité ?",["Problème : la vérité est-elle une ou diverse ?","I. La vérité peut être logique (cohérence), factuelle (accord avec les faits) ou morale (sincérité).","II. Cette diversité fait craindre que la vérité devienne relative.","III. Les vérités diffèrent par leur critère, mais toutes exigent preuve et rigueur.","Conclusion : plusieurs formes de vérité, une même exigence."])],
science:[S("dissertation","La connaissance scientifique est-elle la seule connaissance valable ?",["Problème : les connaissances vulgaire, philosophique et scientifique ont-elles toutes une valeur ?","I. La science est rigoureuse, vérifiable et universelle.","II. Elle laisse de côté le sens, les valeurs et l'expérience vécue, qu'abordent d'autres savoirs.","III. Les connaissances sont complémentaires, chacune avec son domaine.","Conclusion : la science est la plus rigoureuse, pas la seule valable."]),
S("dissertation","Une théorie scientifique est-elle une vérité définitive ?",["Problème : les résultats de la science sont-ils absolus ?","I. La science s'appuie sur le raisonnement et l'expérience, d'où sa fiabilité.","II. L'histoire des sciences montre que les théories sont révisées ou remplacées.","III. La vérité scientifique est provisoire, mais en progrès constant.","Conclusion : la science n'est pas définitive, c'est ce qui la rend vivante."])]
};

var K={
homme:{o:["Connaître la conscience, l'inconscient, la liberté et la violence.","Expliquer la conscience comme caractéristique de l'homme et l'inconscient comme autre dimension de l'homme.","Établir les limites de la conscience et le lien entre déterminisme psychologique et responsabilité.","Apprécier la complexité de la nature humaine."],n:[["Conscience","Capacité de l'homme à se connaître, à penser ses actes et à se juger."],["Inconscient","Ensemble des processus psychiques qui agissent sans que nous en ayons conscience."],["Liberté","Pouvoir de choisir et d'agir par soi-même."],["Violence","Usage de la force qui porte atteinte à autrui, physiquement ou moralement."],["Déterminisme psychologique","Idée que nos actes ont des causes psychiques qui les expliquent."],["Responsabilité","Fait de devoir répondre de ses actes."]],p:["La conscience, caractéristique de l'homme","L'inconscient, autre dimension de l'homme","Les limites de la conscience","Déterminisme psychologique et responsabilité","La complexité de la nature humaine"],a:"Descartes, Freud, Sartre."},
societe:{o:["Connaître la nature sociale de l'homme.","Distinguer l'État de la Nation.","Montrer l'omniprésence de la violence dans l'espace social et le rôle d'autrui dans la manifestation de la liberté.","Apprécier les conditions de la liberté en société."],n:[["Société","Ensemble d'hommes unis par des liens, des règles et des institutions."],["État","Organisation politique qui détient l'autorité sur un territoire."],["Nation","Communauté liée par une histoire, une culture et la volonté de vivre ensemble."],["Autrui","L'autre homme, distinct de moi mais mon semblable."],["Contrat social","Accord par lequel les hommes fondent la société et acceptent ses règles."]],p:["La nature sociale de l'homme","Les fondements de la société","L'État et la Nation","La violence dans l'espace social","Autrui et la liberté","Les conditions de la liberté en société"],a:"Aristote, Hobbes, Rousseau."},
religion:{o:["Connaître l'idée de Dieu, la religion, son rôle social et l'obligation morale.","Expliquer la nature religieuse de l'homme.","Établir l'impact de l'idée de Dieu et de la pratique religieuse sur la liberté.","Apprécier la relation entre Dieu, pratique religieuse et liberté."],n:[["Religion","Ensemble de croyances et de pratiques qui relient l'homme à une réalité sacrée."],["Dieu","Être suprême et créateur, objet de la foi."],["Foi","Adhésion à une croyance sans preuve rationnelle."],["Fanatisme","Attachement violent et intolérant à une croyance."],["Obligation morale","Devoir qui s'impose à la conscience."]],p:["L'idée de Dieu","Les caractères de la religion et son rôle social","La nature religieuse de l'homme","Religion et liberté"],a:"Pascal, Kant, Freud."},
valeur:{o:["Connaître la notion de philosophie et la notion d'histoire.","Montrer le rôle de l'homme dans l'histoire.","Apprécier le rôle de la philosophie dans l'histoire."],n:[["Philosophie","Réflexion critique et rationnelle sur l'homme, le monde et la connaissance (du grec : amour de la sagesse)."],["Histoire","Ensemble des événements du passé humain, et science qui les étudie."],["Esprit critique","Capacité d'examiner et de juger sans rien accepter sans raison."]],p:["Qu'est-ce que la philosophie ?","Qu'est-ce que l'histoire ?","Les rôles de l'homme dans l'histoire","Le rôle de la philosophie dans l'histoire"],a:"Platon, Kant, Hegel. Le professeur indique les œuvres à étudier."},
progres:{o:["Connaître le travail, la technique, le bonheur et les types de progrès.","Expliquer les rapports entre travail et technique.","Montrer le rapport entre progrès matériel et progrès spirituel dans la quête du bonheur.","Apprécier les conditions du bonheur (le développement)."],n:[["Progrès","Passage à un état meilleur, matériel ou moral."],["Travail","Activité par laquelle l'homme transforme la nature pour satisfaire ses besoins."],["Technique","Ensemble de procédés et d'outils pour agir sur la nature."],["Bonheur","État de satisfaction durable."],["Aliénation","Perte de maîtrise de soi ou de son œuvre."]],p:["Le progrès et ses types","Le travail","La technique","Le bonheur","Progrès matériel, progrès spirituel et développement"],a:"Rousseau, Marx, Bergson."},
langage:{o:["Connaître le langage, les formes de communication et les acceptions de la vérité.","Expliquer les rapports entre langage et vérité.","Montrer les limites du langage dans l'expression de la vérité.","Apprécier le pouvoir du langage."],n:[["Langage","Capacité d'exprimer et de communiquer la pensée par des signes."],["Communication","Transmission d'un message entre des êtres."],["Signe","Ce qui représente autre chose que soi."],["Vérité","Accord de la pensée avec le réel (factuelle), avec elle-même (logique) ou avec soi (sincérité)."]],p:["Langage et formes de communication","Les acceptions de la vérité","Langage, moyen d'expression de la vérité","Les limites du langage","Le pouvoir du langage"],a:"Platon, Descartes, Saussure."},
science:{o:["Identifier les formes de connaissance et les caractéristiques de la connaissance scientifique.","Expliquer son processus d'élaboration (raisonnement, expérimentation).","Montrer ses limites dans l'approche du vivant, des sciences humaines et des sciences formelles.","Apprécier son pouvoir."],n:[["Connaissance vulgaire","Issue de l'expérience quotidienne, sans méthode rigoureuse."],["Connaissance scientifique","Rigoureuse, vérifiable et universelle."],["Hypothèse","Explication provisoire à vérifier par les faits."],["Expérimentation","Épreuve d'une hypothèse par des faits provoqués."],["Sciences formelles","Mathématiques et logique, fondées sur la démonstration."]],p:["Les formes de connaissance","Les caractères de la connaissance scientifique","Son élaboration","Ses limites","Son pouvoir"],a:"Bachelard, Claude Bernard, Popper."}

var Y={
homme:[T(0,"Je me crois maître de mes actes parce que je les décide, mais je ne choisis ni le caractère qui les inspire, ni l'enfance qui l'a formé. Pourtant, cela ne suffit pas à m'en décharger : c'est parce que je peux me regarder agir que je peux m'en juger responsable.",["Thème : déterminisme psychologique et responsabilité.","Problème : peut-on être responsable d'actes dont les causes nous échappent ?","Thèse : nous sommes déterminés, mais la conscience fonde la responsabilité.","Étapes : (1) l'illusion de la maîtrise ; (2) les causes non choisies ; (3) la conscience comme base du jugement.","Intérêt : concilier déterminisme et responsabilité ; limite : jusqu'où l'inconscient excuse-t-il ?"])],
societe:[T(0,"On croit que la société limite d'abord la liberté. Mais l'enfant qui apprend à parler, à lire, à se conduire n'accède à l'autonomie que par les autres. Sans eux, il resterait libre de tout faire, c'est-à-dire de presque rien.",["Thème : société, autrui et liberté.","Problème : la société est-elle une limite ou une condition de la liberté ?","Thèse : la liberté se construit par les autres.","Étapes : (1) l'opinion courante ; (2) l'apprentissage par autrui ; (3) la liberté sans société, vide.","Intérêt : dépasser l'opposition individu / société ; limite : la société peut aussi opprimer."])],
religion:[T(0,"Le croyant qui tient sa foi pour une chaîne se trompe peut-être autant que celui qui la tient pour une preuve de vertu. Ce qui libère n'est pas la croyance elle-même, mais la manière dont on s'y rapporte : avec le doute qui l'examine ou avec la peur qui l'interdit.",["Thème : religion et liberté.","Problème : la foi libère-t-elle ou enchaîne-t-elle ?","Thèse : tout dépend du rapport à la croyance, examen ou peur.","Étapes : (1) deux erreurs symétriques ; (2) la croyance n'est pas décisive ; (3) examen contre peur.","Intérêt : éviter les jugements simples ; limite : le doute est-il compatible avec la foi ?"])],
valeur:[T(0,"On dit la philosophie inutile parce qu'elle ne construit ni ponts ni routes. Mais les ponts et les routes servent à aller quelque part : c'est à elle qu'il revient de demander où, et pourquoi.",["Thème : valeur de la philosophie.","Problème : une discipline sans production matérielle est-elle utile ?","Thèse : la philosophie questionne les fins que la technique sert.","Étapes : (1) le reproche d'inutilité ; (2) l'image des ponts et routes ; (3) la question des fins.","Intérêt : distinguer moyens et fins ; limite : la philosophie donne-t-elle des réponses ?"])],
progres:[T(0,"On mesure le progrès aux machines que l'on invente. Mais une société peut multiplier ses outils sans devenir plus juste ni plus heureuse. Le véritable progrès se reconnaît à ce que les hommes deviennent, non à ce qu'ils possèdent.",["Thème : progrès, bonheur et développement.","Problème : à quoi reconnaît-on le véritable progrès ?","Thèse : le progrès véritable est humain, non seulement matériel.","Étapes : (1) le critère courant : les machines ; (2) outils sans justice ni bonheur ; (3) le critère : ce que deviennent les hommes.","Intérêt : lier progrès matériel et spirituel ; limite : comment mesurer le progrès moral ?"])],
science:[T(0,"Le savant ne croit pas ce qu'il voit : il le met à l'épreuve. Une hypothèse n'est jamais confirmée pour toujours, elle reste debout tant que personne n'a montré qu'elle tombe. Sa force n'est pas d'être certaine, mais de pouvoir être corrigée.",["Thème : élaboration de la connaissance scientifique.","Problème : sur quoi repose la valeur d'une connaissance scientifique ?","Thèse : sa valeur tient à sa capacité à être corrigée, non à sa certitude.","Étapes : (1) mettre à l'épreuve ; (2) une hypothèse jamais définitive ; (3) la correction comme force.","Intérêt : la science comme démarche ; limite : peut-on parler de vérité si tout est révisable ?"])]
};

societe:[["Dire que l'homme est un être social, c'est dire que…",["Il a besoin des autres pour vivre et devenir humain","Il aime toujours la compagnie","Il refuse toute règle"],0,"L'homme devient homme par les autres : langage, éducation, entraide."],["Quelle différence entre l'État et la Nation ?",["Aucune","L'État est une organisation politique, la Nation une communauté d'histoire et de culture","La Nation fait les lois, l'État les subit"],1,"L'État organise le pouvoir ; la Nation est une communauté de destin."],["Autrui est…",["Seulement un obstacle à ma liberté","Aussi une condition de ma liberté","Sans rapport avec ma liberté"],1,"Autrui m'éduque, me reconnaît et limite mon arbitraire : il est limite et condition."]],

var Z={
homme:[T(0,"Il est tentant de croire que je suis le seul auteur de mes actes : j'ai délibéré, j'ai décidé, j'ai agi. Mais je n'ai choisi ni le milieu où j'ai grandi, ni les peurs que l'enfance a déposées en moi, ni cette humeur qui, certains jours, colore mes jugements à mon insu. Faut-il conclure que je ne suis responsable de rien ? Ce serait oublier une différence essentielle : une pierre qui tombe ne peut pas se juger, alors que je peux revenir sur ce que j'ai fait, en reconnaître les causes et m'engager à agir autrement. Comprendre pourquoi j'ai agi n'est pas m'excuser ; c'est, au contraire, le commencement de la responsabilité.",["Thème : déterminisme psychologique et responsabilité.","Problème et thèse : peut-on être responsable d'actes aux causes non choisies ? Oui, car la conscience permet de revenir sur ses actes.","Mouvement 1 (jusqu'à « à mon insu ») : l'illusion d'être seul auteur de ses actes ; arguments : milieu, enfance, humeur.","Mouvement 2 (« Faut-il conclure… ») : objection, puis différence entre la pierre et l'homme, qui peut se juger.","Mouvement 3 (dernière phrase) : comprendre ses causes n'excuse pas, c'est le début de la responsabilité.","Intérêt : cohérence de l'argument (conscience comme base du jugement) ; discussion : l'inconscient et la contrainte forte limitent-ils la responsabilité ?"])],
societe:[T(0,"On présente souvent la société comme une contrainte : des règles à suivre, des places à tenir, des regards à supporter. Pourtant, regardons un enfant qui apprend à parler. Chaque mot qu'il acquiert, il le reçoit des autres ; chaque geste de politesse, chaque savoir, chaque métier futur lui vient d'un monde qu'il n'a pas inventé. Laissé seul, il serait libre de faire ce qu'il veut, mais il ne saurait presque rien vouloir. La société ne supprime donc pas la liberté : elle en fournit les moyens. Reste que ces moyens peuvent servir à libérer comme à enfermer, et c'est pourquoi la liberté exige aussi des lois justes.",["Thème : société, autrui et liberté.","Problème et thèse : la société limite-t-elle la liberté ? Non, elle en fournit les moyens, à condition de lois justes.","Mouvement 1 : l'opinion courante, la société comme contrainte.","Mouvement 2 : l'exemple de l'enfant, tout lui vient des autres ; seul, il ne saurait presque rien vouloir.","Mouvement 3 : nuance, les moyens peuvent libérer ou enfermer, d'où le besoin de lois justes.","Intérêt : dépasser l'opposition individu/société ; discussion : et l'oppression sociale, les inégalités ?"])],
religion:[T(0,"Celui qui voit dans la religion une chaîne et celui qui y voit un refuge commettent la même erreur : ils jugent la croyance en elle-même, sans regarder la manière dont on la vit. Une foi qui interdit de poser des questions devient peur, et la peur conduit parfois à haïr ceux qui croient autrement. Une foi qui accepte l'examen, au contraire, peut éclairer la conduite et inviter à la tolérance. Ce n'est donc pas l'objet de la croyance qui rend libre ou esclave, mais le rapport qu'on entretient avec elle. Libre est le croyant qui sait pourquoi il croit, et qui reconnaît à autrui le même droit.",["Thème : religion et liberté.","Problème et thèse : la religion libère-t-elle ou enchaîne-t-elle ? Cela dépend du rapport qu'on a avec la croyance.","Mouvement 1 : deux jugements opposés, une même erreur.","Mouvement 2 : foi fermée (peur, haine) contre foi qui accepte l'examen (tolérance).","Mouvement 3 : conclusion, le croyant libre sait pourquoi il croit et respecte autrui.","Intérêt : évite les jugements simples ; discussion : le doute est-il compatible avec la foi ? Et les dogmes ?"])],
valeur:[T(0,"On reproche à la philosophie de ne rien produire : ni pont, ni médicament, ni machine. Le reproche est exact, mais il passe à côté de l'essentiel. Les ponts, les médicaments et les machines sont des moyens ; ils ne disent pas à quoi ils doivent servir. Or les sociétés ont besoin, de temps à autre, de s'arrêter pour demander ce qui est juste, ce qui vaut la peine d'être poursuivi, ce qu'on est prêt à sacrifier. Cette question n'est pas technique : c'est la question du philosophe. Les grands changements de l'histoire ont d'abord été des idées discutées.",["Thème : valeur de la philosophie et histoire.","Problème et thèse : la philosophie est-elle utile sans rien produire ? Oui, elle interroge les fins que servent les moyens.","Mouvement 1 : le reproche d'inutilité, admis comme exact.","Mouvement 2 : distinction moyens/fins, la technique ne dit pas à quoi elle sert.","Mouvement 3 : la question du juste est philosophique ; les changements historiques naissent d'idées discutées.","Intérêt : distinction moyens/fins ; discussion : les idées agissent-elles seules sans conditions matérielles ?"])],
progres:[T(0,"Un pays qui possède des routes, des téléphones et des usines est-il pour autant plus avancé ? Si l'on répond oui, on identifie le progrès à l'accumulation d'objets. Mais l'histoire montre que les mêmes machines peuvent nourrir ou affamer, soigner ou détruire, rapprocher ou diviser. La valeur d'un instrument dépend de l'usage que les hommes en font, et cet usage dépend de ce qu'ils sont devenus : plus justes, plus attentifs aux autres, plus capables de se maîtriser. C'est pourquoi le progrès matériel, aussi précieux soit-il, ne suffit pas. Il n'est un vrai progrès que s'il s'accompagne d'un progrès des mœurs, de la justice et de la liberté.",["Thème : progrès, bonheur et développement.","Problème et thèse : à quoi reconnaît-on le vrai progrès ? À ce que deviennent les hommes, pas seulement à leurs objets.","Mouvement 1 : le progrès identifié aux objets (routes, téléphones, usines).","Mouvement 2 : ambivalence des machines, leur usage dépend des hommes.","Mouvement 3 : le progrès matériel est précieux mais insuffisant sans progrès moral.","Intérêt : lie progrès matériel et spirituel ; discussion : comment mesurer le progrès moral ?"])],
langage:[T(0,"Parler, ce n'est pas seulement nommer des choses : c'est les ordonner, les comparer, les juger, et par là entrer en relation avec les autres. Grâce aux mots, nous transmettons ce que nous savons à ceux qui ne l'ont pas vu. Mais les mots viennent de tous et appartiennent à tous ; ils ne collent donc jamais exactement à ce que chacun éprouve. Ils peuvent aussi tromper, par ambiguïté ou par mensonge. Dire le vrai demande ainsi du soin : choisir ses termes, les définir, accepter qu'on les discute. Le langage n'est pas la vérité, il en est le chemin, avec ses détours et ses risques.",["Thème : langage et vérité.","Problème et thèse : les mots permettent-ils de dire le vrai ? Oui, comme chemin, avec des limites et des risques.","Mouvement 1 : le pouvoir du langage, ordonner, juger, transmettre.","Mouvement 2 : ses limites, mots communs qui ne collent pas à l'expérience, ambiguïté, mensonge.","Mouvement 3 : exigence de soin pour dire vrai ; le langage est chemin, non vérité.","Intérêt : valeur du langage et de ses limites ; discussion : l'indicible (émotions, expériences) se dit-il ?"])],
science:[T(0,"Pour le sens commun, le savant est celui qui sait. En réalité, il est surtout celui qui doute avec méthode. Il ne se contente pas de ce qu'il observe : il formule une hypothèse, imagine des expériences capables de la contredire, et ne la retient que si elle résiste. Mais résister n'est pas être prouvée pour toujours : une théorie solide aujourd'hui peut être corrigée demain par des faits nouveaux. Loin d'être une faiblesse, cette capacité de se corriger fait la force de la science. Elle distingue une connaissance qui progresse d'une croyance qui se répète.",["Thème : élaboration de la connaissance scientifique.","Problème et thèse : sur quoi repose la valeur de la science ? Sur sa capacité à se corriger, non sur la certitude.","Mouvement 1 : l'image courante du savant qui sait, remplacée par celle du savant qui doute avec méthode.","Mouvement 2 : hypothèse, expériences qui la contredisent, elle n'est retenue que si elle résiste.","Mouvement 3 : une théorie reste révisable ; cette capacité de se corriger fait la force de la science.","Intérêt : science comme démarche ; discussion : si tout est révisable, parle-t-on encore de vérité ?"])]
};

A("dissertation","Le succès de la science rend-il inutile la philosophie ?","BAC 2021",["Termes : succès = triomphe, efficacité ; science = connaissance rationnelle, méthodique et objective ; inutile = vain, superflu, sans valeur ; philosophie = quête de la sagesse, réflexion critique.","Problème : le triomphe de la science dévalorise-t-il la philosophie ?","Axe 1 : l'efficacité de la science dévalorise la philosophie. Arg. 1 : la science, rationnelle et expérimentale, rend vaines les spéculations (cf. Marx, 11e thèse sur Feuerbach). Arg. 2 : science et technique, panacée dans la quête du bien-être (cf. Descartes, Discours de la méthode, 6e partie).","Axe 2 : les limites de la science rendent la philosophie nécessaire. Arg. 1 : la science se limite au monde phénoménal ; la philosophie examine le succès de l'homme (cf. Jaspers, Introduction à la philosophie). Arg. 2 : le progrès scientifique peut mettre l'humanité en péril (cf. Rabelais ; Bergson, un corps agrandi attend un supplément d'âme)."]),
A("texte","Dégagez l'intérêt philosophique du texte de P. J. Hountondji, Sur la « philosophie africaine » (1977).","BAC 2015",["Le texte figure dans l'épreuve officielle de 2015 : à ajouter depuis l'épreuve.","Thème : la définition de la philosophie. Problème : qu'est-ce que la philosophie ? Thèse : la philosophie n'est pas un système clos mais un débat. Antithèse : la philosophie est un savoir achevé. Intention : montrer la nature de la philosophie. Enjeu : la connaissance ou la vérité.","Structure : 1er mouvement (l. 1 à 5) : la philosophie n'est pas un savoir constitué et achevé. 2e mouvement (l. 5 à 14) : la philosophie est une quête perpétuelle de la vérité.","Critique interne : pour montrer la nature de la philosophie, l'auteur commence par dire ce qu'elle n'est pas, puis affirme ce qu'elle est.","Critique externe : (1) le débat philosophique fonde la connaissance ou la vérité (cf. Jaspers ; Russell, Problèmes de philosophie) ; (2) la philosophie a des limites : les interminables débats éloignent de la vérité (cf. Rousseau, Discours sur les sciences et les arts ; Marx, 11e thèse sur Feuerbach)."]),
A("dissertation","Faut-il oublier le passé ?","BAC 2018",["Termes : faut-il = est-il nécessaire de ; oublier = ne pas se souvenir, se désintéresser, refuser de tenir compte ; passé = événement qui a marqué la vie d'un homme, d'une société, de l'humanité ; l'histoire ; temps révolu.","Problème : est-il nécessaire de se passer de l'histoire ?","Axe 1 : le caractère caduc du passé le rend inutile. Arg. 1 : le temps ne se saisit que dans l'instant (cf. Bachelard). Arg. 2 : l'oubli assure la santé du psychisme (cf. Nietzsche, Généalogie de la morale). Arg. 3 : l'histoire est inutile et inopérante (cf. Sénèque, Questions naturelles). Arg. 4 : l'histoire est dangereuse, elle permet de tout justifier (cf. Valéry).","Axe 2 : le passé est nécessaire à l'homme. Arg. 1 : l'homme se définit par son passé (cf. Wordsworth). Arg. 2 : le passé fait partie du présent (cf. Alquié, Le désir d'éternité). Arg. 3 : l'histoire est source d'enseignement (cf. Comte ; Machiavel, Le Prince). Arg. 4 : le recours au passé est source de guérison (cf. Freud, psychanalyse)."])],

A("dissertation","L'homme est-il condamné à travailler ?","BAC 2021",["Termes : condamné à = contraint, forcé, sans avoir le choix ; travailler = exercer une activité physique ou intellectuelle pour transformer la nature, se transformer soi-même et produire le nécessaire.","Problème : le travail est-il une contrainte ?","Axe 1 : le travail est une contrainte. Arg. 1 : il évoque la peine (étymologie du mot travail ; Platon, La République ; la Genèse, le travail comme malédiction après le péché originel). Arg. 2 : il est source d'aliénation (Marx, Manuscrits de 1844).","Axe 2 : le travail est une nécessité. Arg. 1 : il est naturel à l'homme, lié à son intelligence (Kant, Réflexions sur l'éducation). Arg. 2 : il est facteur d'émancipation et de liberté (Hegel, dialectique du maître et de l'esclave ; Dadié, Climbié). Arg. 3 : il humanise : en agissant sur la nature, l'homme se modifie lui-même (Marx, Le Capital)."]),
A("dissertation","L'activité technique dévalorise-t-elle l'homme ?","BAC 2015",["Termes : activité technique = mise en œuvre de moyens d'action, découvertes et innovations pour transformer la nature ; dévaloriser = entraîner la déchéance, déshumaniser.","Problème : la technique est-elle nuisible à l'homme ?","Axe 1 : l'activité technique entraîne la perdition de l'homme. Arg. 1 : elle avilit, pervertit et déséquilibre moralement (cf. Rousseau, Discours sur les sciences et les arts). Arg. 2 : elle déshumanise (cf. Marx, Manuscrits de 1844).","Axe 2 : l'activité technique valorise réellement l'homme. Arg. 1 : le savoir technique, trait rationnel, valorise l'intelligence (cf. Bergson, L'évolution créatrice). Arg. 2 : la technique confère un pouvoir immense à l'homme (cf. Descartes, Discours de la méthode)."]),
A("texte","Dégagez l'intérêt philosophique de ce texte à partir de son étude ordonnée.","BAC 2018",["Thème : l'impact de la machine. Problème : quel est l'impact de la machine sur l'homme ? Thèse : la machine a procuré à l'homme une extension et une puissance disproportionnées à sa force. Intention : montrer que le progrès matériel doit s'accompagner d'un progrès spirituel et moral. Antithèse : la technique garantit l'épanouissement de l'homme. Enjeu : le bonheur.","Structure : 3 mouvements. 1er (l. 1 à 4) : les instruments prolongent nos organes. 2e (l. 5 à 10) : les machines favorisent la réussite matérielle de l'humanité. 3e (l. 11 à 16) : la morale doit combler le vide entre le corps et l'âme.","Critique interne : l'auteur montre que les instruments prolongent nos organes, puis le rôle de la machine dans la réussite matérielle, enfin le déséquilibre entre l'âme et le corps ; sa démarche est en adéquation avec son intention.","Critique externe : Axe 1, le progrès de la machine entrave le bonheur (cf. Rousseau ; Michel Henry, La barbarie ; Einstein ; Marx sur l'ouvrier aliéné ; menace pour le développement durable). Axe 2, le progrès technique contribue au bonheur (cf. Descartes, maîtres et possesseurs de la nature ; Fourastié, Pourquoi nous travaillons ; le scientisme)."],"Si nos organes sont des instruments naturels, nos instruments sont, par là même, des organes artificiels. L'outil de l'ouvrier continue son bras ; l'outillage de l'humanité est donc un prolongement de son corps. La nature, en nous dotant d'une intelligence essentiellement fabricatrice, avait ainsi préparé pour nous un certain agrandissement. Mais des machines qui marchent au pétrole, au charbon, à la « houille blanche », et qui convertissent en mouvement des énergies potentielles accumulées pendant des millions d'années, sont venues donner à notre organisme une extension si vaste et une puissance si formidable, si disproportionnée à sa dimension et à sa force, que sûrement il n'en avait rien été prévu dans le plan de structure de notre espèce : ce fut une chance unique, la plus grande réussite matérielle de l'homme sur la planète. (…) Or, dans ce corps démesurément grossi, l'âme reste ce qu'elle était, trop petite maintenant pour le remplir, trop faible pour le diriger. D'où le vide entre lui et elle. D'où les redoutables problèmes sociaux, politiques, internationaux, qui sont autant de définitions de ce vide et qui, pour le combler, provoquent aujourd'hui tant d'efforts désordonnés et inefficaces : il y faudrait de nouvelles réserves d'énergie potentielle, cette fois morale. (H. Bergson, Les deux sources de la morale et de la religion)")],

A("texte","Dégagez l'intérêt philosophique de ce texte à partir de son étude ordonnée.","BAC 2021",["Thème : la condition de la liberté. Problème : quelle est la condition de la liberté ? Thèse : la liberté consiste à obéir aux lois. Intention : montrer que la loi garantit la liberté. Enjeu : le bonheur.","Structure : 2 mouvements. 1er (l. 1 à 10) : différence entre indépendance et liberté. 2e (l. 10 à 15) : le respect des lois comme facteur de liberté.","Critique interne : en distinguant indépendance et liberté, l'auteur montre que la liberté suppose des exigences et le respect des lois ; sa démarche est convaincante.","Critique externe : (1) la loi garantit la liberté : elle instaure le droit et la justice (cf. philosophes du contrat) ; (2) la loi entrave la liberté : elle peut engendrer l'injustice (cf. Calliclès, dans le Gorgias de Platon ; Hobbes, Du citoyen)."],"On a beau vouloir confondre l'indépendance et la liberté. Ces deux choses sont si différentes que même elles s'excluent mutuellement. Quand chacun fait ce qu'il lui plaît, on fait souvent ce qui déplaît à d'autres, et cela ne s'appelle pas un état libre. La liberté consiste moins à faire sa volonté qu'à n'être pas soumis à celle d'autrui ; elle consiste encore à ne pas soumettre la volonté d'autrui à la nôtre. Quiconque est maître ne peut être libre, et régner c'est obéir (…) Je ne connais de volonté vraiment libre que celle à laquelle nul n'a droit d'opposer de la résistance ; dans la liberté commune nul n'a droit de faire ce que la liberté d'un autre lui interdit, et la vraie liberté n'est jamais destructive d'elle-même. Ainsi la liberté sans la justice est une véritable contradiction ; car comme qu'on s'y prenne tout gêne dans l'exécution d'une volonté désordonnée. Il n'y a donc point de liberté sans Lois, ni où quelqu'un est au-dessus des lois : dans l'état même de nature l'homme n'est libre qu'à la faveur de la loi naturelle qui commande à tous. Un peuple libre obéit, mais il ne sert pas ; il a des chefs et non pas des maîtres ; il obéit aux Lois, mais il n'obéit qu'aux lois et c'est par la force des lois qu'il n'obéit pas aux hommes (…) Un peuple est libre, quelque forme qu'ait son gouvernement, quand dans celui qui le gouverne il ne voit point l'homme, mais l'organe de la loi. (J.-J. Rousseau, Lettres écrites de la montagne)")],

A("dissertation","L'existence de Dieu est-elle un obstacle à la liberté ?","BAC 2018",["Termes : existence de Dieu = affirmation ou présence de l'être absolu, transcendant, croyance en Dieu ; obstacle = frein, limite, entrave ; liberté = faculté d'agir indépendamment de toute contrainte, autodétermination.","Problème : la croyance en Dieu est-elle incompatible avec la liberté ?","Axe 1 : l'existence de Dieu peut être un obstacle à la liberté. Arg. 1 : Dieu, créateur de l'univers, prédestine l'homme (fatalisme ; Leibniz, Théodicée ; « Mektoub »). Arg. 2 : la pratique religieuse est un ensemble de commandements auxquels les fidèles se soumettent (cf. Marx ; les dix commandements, Exode). Arg. 3 : les dogmes entravent le libre exercice de la raison (cf. Feuerbach, L'essence du christianisme).","Axe 2 : la présence de Dieu n'exclut pas la liberté. Arg. 1 : Dieu a doté l'homme du libre arbitre (cf. Gide, Les caves du Vatican ; Descartes, Méditations métaphysiques ; Deutéronome)."])],

A("dissertation","La liberté est-elle une vue de l'esprit ?","BAC 2015",["Termes : liberté = fait d'agir sans contrainte, faculté de s'autodéterminer ; vue de l'esprit = imagination, utopie, leurre, illusion.","Reformulation : l'autodétermination du sujet est-elle une illusion ? Problème : l'homme peut-il être libre ?","Axe 1 : la liberté absolue, une vue de l'esprit. Arg. 1 : la liberté comme absence de contrainte est un leurre (cf. Spinoza, Éthique). Arg. 2 : le déterminisme psychologique contredit l'idée de liberté (cf. Freud, l'inconscient). Arg. 3 : la croyance au destin rend la liberté utopique (fatalistes, essentialistes).","Axe 2 : la liberté, une donnée réalisable. Arg. 1 : obéir à la loi conduit à la liberté (cf. Rousseau, Du contrat social). Arg. 2 : agir conformément à la morale conduit à la liberté (cf. Kant, Critique de la raison pratique ; les religions révélées, la foi libère des vices et de l'angoisse existentielle). Arg. 3 : l'homme peut s'assumer en toute liberté par sa conscience (cf. Sartre, L'existentialisme est un humanisme)."])]
};

var CQ={"Le succès de la science rend-il inutile la philosophie ?":"Le succès de la science ne rend pas la philosophie inutile : la science explique le monde phénoménal, la philosophie interroge son sens et ses limites. Les deux se complètent.","Faut-il oublier le passé ?":"Il ne faut pas oublier le passé : l'oubli protège parfois l'esprit, mais le passé nous définit et nous instruit. Il s'agit de s'en souvenir sans en être prisonnier.","L'homme est-il condamné à travailler ?":"Le travail est une peine et une contrainte, mais aussi une nécessité qui libère et humanise l'homme. Il n'est donc pas une condamnation, à condition d'être digne et choisi.","L'activité technique dévalorise-t-elle l'homme ?":"L'activité technique peut avilir et déshumaniser l'homme, mais elle valorise aussi son intelligence et sa puissance. Tout dépend de l'usage qu'il en fait.","L'existence de Dieu est-elle un obstacle à la liberté ?":"La croyance en Dieu peut limiter la liberté par la prédestination, les commandements et les dogmes, mais elle ne l'exclut pas, puisque Dieu a doté l'homme du libre arbitre.","La liberté est-elle une vue de l'esprit ?":"La liberté absolue est une illusion, mais la liberté de l'homme qui obéit aux lois et à la morale et qui s'assume par sa conscience est une réalité à construire."};

CT["societe|"+TS]="Le texte montre que la société, loin d'abolir la liberté, en donne les moyens. Je partage cette thèse, tout en gardant à l'esprit que la société doit elle-même être juste pour rester libératrice.";
CT["religion|"+TS]="Le texte invite à juger la foi par la manière dont on la vit, non par son objet. Je pense comme l'auteur que ce sont l'esprit critique et la tolérance qui font la liberté du croyant.";
CT["valeur|"+TS]="Le texte réhabilite la philosophie comme réflexion sur les fins. Je le crois : sans cette question, la technique avance sans savoir où elle va.";
CT["progres|"+TS]="Le texte rappelle que le progrès se mesure à l'homme, non aux objets. Son idée reste actuelle : sans progrès moral, les moyens techniques ne rendent pas heureux.";
CT["langage|"+TS]="Le texte fait du langage un chemin vers la vérité, non la vérité elle-même. J'adhère à cette vue : dire vrai demande de la rigueur et le goût de la discussion.";
CT["science|"+TS]="Le texte fonde la valeur de la science sur sa capacité à se corriger. Cette thèse me semble juste : une science qui progresse est plus sûre qu'une croyance qui se répète.";

CT["societe|BAC 2021"]="Le texte établit que la liberté ne s'oppose pas à la loi mais en dépend. Je partage cette thèse, à condition que les lois soient justes, car une loi injuste peut elle-même entraver la liberté.";

function go(v,l,i){V.v=v;V.l=l||null;V.i=i==null?null:i;V.show=false;render();window.scrollTo(0,0)}
function fav(l,i){var k=key(l,i),p=F.indexOf(k);if(p<0)F.push(k);else F.splice(p,1);save();render()}
function head(title,back){return '<header>'+(back?'<button class="ghost" data-go="'+back+'" aria-label="Retour">←</button>':'')+'<h1>'+(V.v==="home"?'<svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Logo Philo TC" style="vertical-align:-10px;margin-right:10px"><rect width="40" height="40" rx="10" fill="#0a8f5b"/><circle cx="32" cy="8" r="4" fill="#f77f00"/><text x="20" y="29" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" font-family="Georgia,serif">φ</text></svg>':"")+title+'</h1>'+(V.v==="home"?'<button class="ghost" data-go="favs">Favoris ('+F.length+')</button>':'')+'</header>'}
function item(l,i,showLesson){var s=l.s[i];return '<button class="row" data-open="'+l.id+'|'+i+'"><span><span class="tag">'+s.k+'</span>'+(/^BAC/.test(s.src)?'<span class="tag" style="background:var(--acc);color:var(--acc-ink)">'+s.src.slice(0,8)+'</span>':'')+(showLesson?'<small>'+l.t+'</small><br>':'')+s.q+'</span><small>'+(F.indexOf(key(l.id,i))>-1?'★':'›')+'</small></button>'}
function render(){var h="";
if(V.v==="home"){
 h=head("Philo TC")+'<h2 class="hero">Prépare ton BAC de philo, leçon après leçon</h2><p class="sub">Choisis une leçon. Tu peux verrouiller une leçon pas encore étudiée.</p><p class="sub"><b>'+QN()+' questions</b> pour réviser les '+L.length+' leçons du programme.</p><div class="btns"><button class="primary" data-rand="1">Quiz aléatoire</button><button class="outl" data-go="bac">Annales du BAC</button></div>'+(DP?'<button class="primary" data-inst="1" style="width:100%;margin-bottom:12px">📲 Installer Philo TC</button>':'')+'<div class="seg">'+SEG()+'</div><input type="search" id="q" placeholder="Chercher un sujet ou une notion" value="'+V.q.replace(/"/g,"&quot;")+'">';
 var q=V.q.trim().toLowerCase();
 if(q){var n=0;L.forEach(function(l){l.s.forEach(function(s,i){if((s.q+" "+l.t).toLowerCase().indexOf(q)>-1){h+=item(l,i,true);n++}})});if(!n)h+='<p class="empty">Aucun sujet trouvé. Essaie un autre mot.</p>'}
 else{G.forEach(function(g,gi){var n=0;h+='<div class="grp" style="--c:'+GC[gi]+'">Compétence '+(gi+1)+' · '+g+'</div>';L.forEach(function(l){if(l.g===gi){n++;var lk=LK.indexOf(l.id)>-1;h+='<button class="lrow'+(lk?' lk':'')+'" data-lesson="'+l.id+'" style="--c:'+GC[gi]+'"><span class="num">'+n+'</span><span class="lt"><b>'+l.t+'</b><small>'+(lk?'Verrouillée':'Ouverte')+'</small></span><span class="open">Ouvrir</span></button>'}})});h+='<p class="sub">Source : programme éducatif de Philosophie, Terminales C, D et E (DPFC).</p>'}
}else if(V.v==="lesson"){
 var l=lesson(V.l);h=head(l.t,"home")+'<button class="ghost" data-lock="'+l.id+'" style="margin-bottom:12px;color:var(--ink)">'+(LK.indexOf(l.id)>-1?'🔓 Déverrouiller':'🔒 Verrouiller')+' cette leçon</button>'+cours(l)+(Q[l.id]?'<button class="row" data-quiz="'+l.id+'" style="--gc:#14a86c"><b>🧠 1. Exercice de compréhension</b><small>'+Q[l.id].length+' questions ›</small></button><h2>2. Sujets</h2>':'')+'<div class="chips">'+["tous","dissertation","texte","méthode"].map(function(t){return '<button class="chip" data-type="'+t+'" aria-pressed="'+(V.type===t)+'">'+t+'</button>'}).join("")+'</div>';
 var n2=0;l.s.forEach(function(s,i){if(!/^BAC/.test(s.src)&&(V.type==="tous"||s.k===V.type)){h+=item(l,i);n2++}});
 if(!n2)h+='<p class="empty">Aucun sujet de ce type pour cette leçon.</p>';
}else if(V.v==="subject"){
 var l2=lesson(V.l),s=l2.s[V.i],isF=F.indexOf(key(V.l,V.i))>-1;
 h=head(l2.t,V.from==="bac"||V.from==="favs"?V.from:"lesson:"+V.l)+'<span class="tag">'+s.k+'</span><p class="q">'+s.q+'</p>'+(s.txt?'<p class="txt">'+s.txt+'</p>':'')+'<p class="src">'+s.src+'</p>';
 h+='<div class="nav"><button class="ghost" data-fav="1">'+(isF?'★ Dans mes favoris':'☆ Ajouter aux favoris')+'</button></div>';
 if(!V.show&&s.k!=="méthode")h+='<div class="nav"><button class="primary" data-corr="1">Voir le corrigé</button></div><p class="sub">Essaie d\'abord de construire ton plan, puis compare.</p>';
 else{h+='<div class="corr"><h3>'+(s.k==="méthode"?"Méthode":"Corrigé (plan)")+'</h3>'+s.c.map(function(x){return '<p>'+x+'</p>'}).join('<br>')+'</div>'}
}else if(V.v==="bac"){
 h=head("Annales du BAC","home")+'<p class="sub">Séries C, D, E · sujets officiels et corrigés</p>';
 var yrs={};B().forEach(function(x){var y=x[0].s[x[1]].src.slice(4,8);(yrs[y]=yrs[y]||[]).push(x)});
 Object.keys(yrs).sort().reverse().forEach(function(y){h+='<h2>BAC '+y+'</h2>';yrs[y].forEach(function(x){h+=item(x[0],x[1],true)})});
}else if(V.v==="quiz"){
 var l3=lesson(V.l)||{t:"Quiz aléatoire"},Qs=Q[V.l],A=V.qa[V.l]||{},sc=0;
 h=head((V.l==="_rand"?"":"Exercice : ")+l3.t,V.l==="_rand"?"home":"lesson:"+V.l)+'<p class="sub">Réponds avant de traiter les sujets. Touche une réponse pour voir la correction.</p>';
 Qs.forEach(function(z,i){var a=A[i];if(a!=null&&a===z[2])sc++;
  h+='<div class="qz"><p class="qq">'+(i+1)+'. '+z[0]+'</p>'+z[1].map(function(o,j){var cl="qo";if(a!=null){if(j===z[2])cl+=" ok";else if(j===a)cl+=" ko"}return '<button class="'+cl+'" data-qz="'+i+'|'+j+'">'+o+'</button>'}).join("")+(a!=null?'<p class="ex">'+(a===z[2]?"✔ Bonne réponse. ":"✘ Pas tout à fait. ")+z[3]+'</p>':'')+'</div>'});
 h+='<p class="score">Score : '+sc+' / '+Qs.length+'</p><button class="primary" data-go="'+(V.l==="_rand"?"home":"lesson:"+V.l)+'">'+(V.l==="_rand"?"Retour":"Passer aux sujets")+'</button>';
}else if(V.v==="favs"){
 h=head("Mes favoris","home");var any=false;
 L.forEach(function(l){l.s.forEach(function(s,i){if(F.indexOf(key(l.id,i))>-1){h+=item(l,i,true);any=true}})});
 if(!any)h+='<p class="empty">Aucun favori pour l\'instant. Ouvre un sujet et touche ☆.</p>';
}
$.innerHTML=h+NAV();
var q2=document.getElementById("q");if(q2){q2.addEventListener("input",function(e){V.q=e.target.value;var p=e.target.selectionStart;render();var n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)})}
}
$.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 if(d.lesson){V.type="tous";go("lesson",d.lesson)}
 else if(d.open){var p=d.open.split("|");V.from=V.v;go("subject",p[0],+p[1])}
 else if(d.go){var g=d.go.split(":");if(g[0]==="home")V.q="";go(g[0],g[1])}
 else if(d.type){V.type=d.type;render()}
 else if(d.corr){V.show=true;render()}
 else if(d.fav){fav(V.l,V.i)}
 else if(d.quiz){go("quiz",d.quiz)}
 else if(d.inst){if(DP){DP.prompt();DP=null;render()}}
 else if(d.lock){var ix=LK.indexOf(d.lock);if(ix<0)LK.push(d.lock);else LK.splice(ix,1);try{localStorage.setItem("lk",JSON.stringify(LK))}catch(e){}render()}
 else if(d.rand){var pool=[];L.forEach(function(l){if(Q[l.id]&&LK.indexOf(l.id)<0)Q[l.id].forEach(function(z){pool.push(z)})});pool.sort(function(){return Math.random()-.5});if(pool.length){Q._rand=pool.slice(0,10);V.qa._rand={};go("quiz","_rand")}}
 else if(d.qz){var z=d.qz.split("|");V.qa[V.l]=V.qa[V.l]||{};if(V.qa[V.l][z[0]]==null)V.qa[V.l][z[0]]=+z[1];render()}
});
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
